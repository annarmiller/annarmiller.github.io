```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anna R. Miller — Video Producer</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap');


        /* ------------------------------
           RESET
        ------------------------------ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* ------------------------------
           BASE
        ------------------------------ */

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            background: #111;
            color: #f3f1ed;

            font-family: "Inter", Helvetica, Arial, sans-serif;
        }


        /* ------------------------------
           BACKGROUND VIDEO
        ------------------------------ */

        .hero-video {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            z-index: 0;
        }


        /* ------------------------------
           VIDEO OVERLAY
        ------------------------------ */

        .overlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            /* Slightly lighter so the video comes through */
            background: rgba(0, 0, 0, 0.25);

            z-index: 1;
        }


        /* ------------------------------
           HERO
        ------------------------------ */

        .hero {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            z-index: 2;

            padding: 24px;
        }


        /* ------------------------------
           NAME
        ------------------------------ */

        .title {
            font-size: clamp(42px, 7vw, 100px);

            font-weight: 400;

            letter-spacing: -0.06em;

            line-height: 1;

            margin-bottom: 20px;

            color: #f3f1ed;

            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }


        /* ------------------------------
           PROFESSION
        ------------------------------ */

        .subtitle {
            font-size: 14px;

            font-weight: 400;

            text-transform: uppercase;

            letter-spacing: 0.08em;

            margin-bottom: 50px;

            color: #f3f1ed;

            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.3);
        }


        /* ------------------------------
           VIEW MY WORK
        ------------------------------ */

        .work-button {
            display: inline-block;

            padding: 12px 25px;

            background: transparent;

            color: #f3f1ed;

            border: 1px solid rgba(243, 241, 237, 0.5);

            font-family: inherit;

            font-size: 12px;

            font-weight: 400;

            text-transform: uppercase;

            letter-spacing: 0.05em;

            text-decoration: none;

            cursor: pointer;

            transition: all 0.25s ease;
        }


        .work-button:hover {
            background: #f3f1ed;

            color: #111;

            border-color: #f3f1ed;
        }


        /* ------------------------------
           MOBILE
        ------------------------------ */

        @media (max-width: 700px) {

            .hero {
                padding: 24px 22px;
            }


            .title {
                font-size: clamp(38px, 12vw, 65px);

                letter-spacing: -0.055em;
            }


            .subtitle {
                font-size: 12px;

                letter-spacing: 0.07em;

                margin-bottom: 40px;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         BACKGROUND VIDEO
    ================================== -->

    <video
        class="hero-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
        poster="hero-poster.png"
    >

        <source src="hero.mp4" type="video/mp4">

        Your browser does not support the video tag.

    </video>


    <!-- Video overlay -->
    <div class="overlay"></div>


    <!-- =================================
         HOMEPAGE
    ================================== -->

    <main class="hero">

        <h1 class="title">
            Anna R. Miller
        </h1>


        <div class="subtitle">
            Video Producer
        </div>


        <a
            class="work-button"
            href="reels.html"
        >
            View My Work
        </a>

    </main>


</body>

</html>
```
