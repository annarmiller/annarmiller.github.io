<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anna R. Miller — Video Producer</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #f3f1ed;
            color: #111;
            font-family: "Inter", Helvetica, Arial, sans-serif;
        }

        .landing {
            min-height: 100vh;
            padding: 32px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .name {
            font-size: 15px;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        .location {
            font-size: 13px;
            color: #777;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            text-align: center;
        }

        h1 {
            font-size: clamp(56px, 9vw, 140px);
            font-weight: 400;
            letter-spacing: -0.065em;
            line-height: 0.9;
            margin-bottom: 45px;
        }

        .work-link {
            color: #111;
            text-decoration: none;
            font-size: 14px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            border-bottom: 1px solid #111;
            padding-bottom: 5px;
            transition: opacity 0.25s ease;
        }

        .work-link:hover {
            opacity: 0.45;
        }

        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #777;
        }

        @media (max-width: 700px) {
            .landing {
                padding: 24px 22px;
            }

            .location {
                display: none;
            }

            h1 {
                font-size: clamp(52px, 16vw, 90px);
                line-height: 0.92;
            }

            footer {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <div class="landing">

        <header>
            <div class="name">ANNA R. MILLER</div>
            <div class="location">NEW YORK</div>
        </header>

        <main>
            <h1>Video Producer</h1>

            <a class="work-link" href="reels.html">
                View My Work →
            </a>
        </main>

        <footer>
            <div>© 2026 Anna R. Miller</div>
            <div>Video · Editorial · Production</div>
        </footer>

    </div>

</body>
</html>
