```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ANNA R. MILLER — Video Producer</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">


    <style>

        /* ------------------------------
           RESET
        ------------------------------ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family: "DM Sans", Arial, Helvetica, sans-serif;

            background: #000;
            color: #fff;
        }


        /* ------------------------------
           BACKGROUND VIDEO
        ------------------------------ */

        .hero-video {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            z-index: 0;
        }


        /* ------------------------------
           DARK OVERLAY
        ------------------------------ */

        .overlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            /* Lightened so more of the background video shows */
            background: rgba(0, 0, 0, 0.25);

            z-index: 1;
        }


        /* ------------------------------
           MAIN CONTENT
        ------------------------------ */

        .hero {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            z-index: 2;

            padding: 20px;
        }


        /* ------------------------------
           NAME
        ------------------------------ */

        .title {
            font-size: clamp(2.5rem, 6vw, 6rem);

            font-weight: 400;

            letter-spacing: 0.08em;

            text-transform: uppercase;

            line-height: 1.05;

            margin-bottom: 14px;

            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.35);
        }


        /* ------------------------------
           PROFESSION
        ------------------------------ */

        .subtitle {
            font-size: clamp(0.9rem, 1.5vw, 1.2rem);

            font-weight: 400;

            letter-spacing: 0.28em;

            text-transform: uppercase;

            margin-bottom: 42px;

            color: rgba(255, 255, 255, 0.9);

            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.35);
        }


        /* ------------------------------
           VIEW MY WORK BUTTON
        ------------------------------ */

        .work-button {
            display: inline-block;

            padding: 15px 30px;

            border: 1px solid rgba(255, 255, 255, 0.85);

            border-radius: 0;

            color: #fff;
            background: transparent;

            font-family: inherit;

            font-size: 12px;
            font-weight: 500;

            letter-spacing: 0.18em;

            text-transform: uppercase;

            text-decoration: none;

            cursor: pointer;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }


        .work-button:hover {
            background: #fff;

            color: #000;

            border-color: #fff;

            transform: translateY(-2px);
        }


        /* ------------------------------
           MOBILE
        ------------------------------ */

        @media (max-width: 600px) {

            .title {
                font-size: 2.5rem;

                padding: 0 10px;

                letter-spacing: 0.06em;
            }


            .subtitle {
                font-size: 0.8rem;

                letter-spacing: 0.22em;

                margin-bottom: 35px;
            }


            .work-button {
                padding: 14px 24px;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         BACKGROUND VIDEO
    ================================== -->

    <video
        class="hero-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    >

        <source src="hero.mp4" type="video/mp4">

        Your browser does not support the video tag.

    </video>


    <!-- Lighter dark overlay -->
    <div class="overlay"></div>


    <!-- =================================
         HOMEPAGE CONTENT
    ================================== -->

    <main class="hero">

        <h1 class="title">
            ANNA R. MILLER
        </h1>


        <div class="subtitle">
            Video Producer
        </div>


        <!--
            Clicking this button now goes
            directly to reels.html.
            The password is handled there.
        -->

        <a
            class="work-button"
            href="reels.html"
        >
            View My Work
        </a>

    </main>


</body>

</html>
```
