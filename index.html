<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Anna R. Miller — Video Producer</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #111;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* =========================
       LANDING PAGE
       ========================= */

    .landing {
      position: relative;
      height: 100vh;
      min-height: 600px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 40px;
    }

    /* Video background */

    .hero-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Darkens the video */

    .video-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.48);
      z-index: 1;
    }

    /* Content sits above video */

    .landing header,
    .landing main,
    .landing footer {
      position: relative;
      z-index: 2;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .name {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .location {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.65);
    }

    nav a {
      color: #f5f5f5;
      text-decoration: none;
      margin-left: 28px;
      font-size: 13px;
      transition: opacity 0.25s ease;
    }

    nav a:hover {
      opacity: 0.5;
    }

    .landing main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
    }

    .landing h1 {
      font-size: clamp(56px, 9vw, 140px);
      font-weight: 400;
      letter-spacing: -0.065em;
      line-height: 0.9;
      margin-bottom: 45px;
    }

    .work-link {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      padding-bottom: 5px;
      transition: opacity 0.25s ease;
    }

    .work-link:hover {
      opacity: 0.5;
    }

    .landing footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    /* =========================
       CONTENT SECTIONS
       ========================= */

    section {
      padding: 100px 40px;
      border-top: 1px solid #333;
    }

    section h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      margin-bottom: 50px;
    }

    .about {
      max-width: 800px;
      font-size: clamp(28px, 4vw, 52px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .contact {
      font-size: clamp(40px, 7vw, 100px);
      letter-spacing: -0.05em;
    }

    .contact a {
      color: white;
      text-decoration: none;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 700px) {

      .landing {
        padding: 24px 22px;
        min-height: 100svh;
      }

      .location {
        display: none;
      }

      nav a {
        margin-left: 14px;
        font-size: 12px;
      }

      .landing h1 {
        font-size: clamp(52px, 16vw, 90px);
        line-height: 0.92;
      }

      .landing footer {
        font-size: 11px;
      }

      section {
        padding: 80px 22px;
      }

      /*
        The video remains visible on mobile,
        but is slightly darker for readability.
      */

      .video-overlay {
        background: rgba(0, 0, 0, 0.55);
      }
    }
  </style>
</head
