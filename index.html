<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <!-- Mobile responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ANNA R. MILLER — Video Producer</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">


    <style>

        /* ------------------------------
           RESET
        ------------------------------ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family: "DM Sans", Arial, Helvetica, sans-serif;

            background: #000;
            color: #fff;
        }


        /* ------------------------------
           BACKGROUND VIDEO
        ------------------------------ */

        .hero-video {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            z-index: 0;
        }


        /* ------------------------------
           DARK OVERLAY
        ------------------------------ */

        .overlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            /* Lighter than before so more of the video shows through */
            background: rgba(0, 0, 0, 0.25);

            z-index: 1;
        }


        /* ------------------------------
           MAIN CONTENT
        ------------------------------ */

        .hero {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            text-align: center;

            z-index: 2;

            padding: 20px;
        }


        /* ------------------------------
           NAME
        ------------------------------ */

        .title {
            font-size: clamp(2.5rem, 6vw, 6rem);

            font-weight: 400;

            letter-spacing: 0.08em;

            text-transform: uppercase;

            line-height: 1.05;

            margin-bottom: 14px;

            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.35);
        }


        /* ------------------------------
           PROFESSION
        ------------------------------ */

        .subtitle {
            font-size: clamp(0.9rem, 1.5vw, 1.2rem);

            font-weight: 400;

            letter-spacing: 0.28em;

            text-transform: uppercase;

            margin-bottom: 42px;

            color: rgba(255, 255, 255, 0.9);

            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.35);
        }


        /* ------------------------------
           VIEW MY WORK BUTTON
        ------------------------------ */

        .work-button {
            display: inline-block;

            padding: 15px 30px;

            border: 1px solid rgba(255, 255, 255, 0.85);

            border-radius: 0;

            color: #fff;
            background: transparent;

            font-family: inherit;

            font-size: 12px;
            font-weight: 500;

            letter-spacing: 0.18em;

            text-transform: uppercase;

            text-decoration: none;

            cursor: pointer;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }


        .work-button:hover {
            background: #fff;

            color: #000;

            border-color: #fff;

            transform: translateY(-2px);
        }


        /* ------------------------------
           PASSWORD MODAL
        ------------------------------ */

        .password-modal {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: none;

            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.75);

            z-index: 10;

            padding: 20px;
        }


        .password-modal.active {
            display: flex;
        }


        /* ------------------------------
           PASSWORD BOX
        ------------------------------ */

        .password-box {
            width: 100%;
            max-width: 400px;

            padding: 40px;

            background: rgba(15, 15, 15, 0.95);

            border: 1px solid rgba(255, 255, 255, 0.2);

            text-align: center;
        }


        .password-box h2 {
            margin-bottom: 10px;

            font-size: 18px;

            font-weight: 400;

            letter-spacing: 0.08em;

            text-transform: uppercase;
        }


        .password-box p {
            margin-bottom: 25px;

            font-size: 13px;

            line-height: 1.6;

            color: rgba(255, 255, 255, 0.65);
        }


        /* ------------------------------
           PASSWORD INPUT
        ------------------------------ */

        .password-input {
            width: 100%;

            padding: 13px 14px;

            margin-bottom: 12px;

            border: 1px solid rgba(255, 255, 255, 0.3);

            background: transparent;

            color: #fff;

            font-family: inherit;

            font-size: 14px;

            outline: none;

            text-align: center;
        }


        .password-input:focus {
            border-color: #fff;
        }


        .password-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }


        /* ------------------------------
           ENTER BUTTON
        ------------------------------ */

        .submit-button {
            width: 100%;

            padding: 13px;

            border: 1px solid #fff;

            background: #fff;

            color: #000;

            font-family: inherit;

            font-size: 12px;

            font-weight: 600;

            letter-spacing: 0.15em;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                background 0.3s ease,
                color 0.3s ease;
        }


        .submit-button:hover {
            background: transparent;

            color: #fff;
        }


        /* ------------------------------
           ERROR MESSAGE
        ------------------------------ */

        .error-message {
            display: none;

            margin-top: 15px;

            color: #ff6b6b;

            font-size: 12px;
        }


        .error-message.show {
            display: block;
        }


        /* ------------------------------
           CLOSE BUTTON
        ------------------------------ */

        .close-button {
            margin-top: 20px;

            border: none;

            background: none;

            color: rgba(255, 255, 255, 0.5);

            font-family: inherit;

            font-size: 11px;

            letter-spacing: 0.1em;

            text-transform: uppercase;

            cursor: pointer;
        }


        .close-button:hover {
            color: #fff;
        }


        /* ------------------------------
           MOBILE
        ------------------------------ */

        @media (max-width: 600px) {

            .title {
                font-size: 2.5rem;

                padding: 0 10px;

                letter-spacing: 0.06em;
            }


            .subtitle {
                font-size: 0.8rem;

                letter-spacing: 0.22em;

                margin-bottom: 35px;
            }


            .work-button {
                padding: 14px 24px;
            }


            .password-box {
                padding: 30px 25px;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         BACKGROUND VIDEO
    ================================== -->

    <video
        class="hero-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    >

        <source src="hero.mp4" type="video/mp4">

        Your browser does not support the video tag.

    </video>


    <!-- Lighter dark overlay -->
    <div class="overlay"></div>


    <!-- =================================
         HOMEPAGE CONTENT
    ================================== -->

    <main class="hero">

        <h1 class="title">
            ANNA R. MILLER
        </h1>


        <div class="subtitle">
            Video Producer
        </div>


        <button
            class="work-button"
            id="viewWorkButton"
            type="button"
        >
            View My Work
        </button>

    </main>


    <!-- =================================
         PASSWORD MODAL
    ================================== -->

    <div
        class="password-modal"
        id="passwordModal"
    >

        <div class="password-box">

            <h2>Private Reels</h2>


            <p>
                Enter the password to view my work.
            </p>


            <form id="passwordForm">

                <input
                    type="password"
                    id="passwordInput"
                    class="password-input"
                    placeholder="Password"
                    autocomplete="off"
                    required
                >


                <button
                    type="submit"
                    class="submit-button"
                >
                    Enter
                </button>

            </form>


            <div
                class="error-message"
                id="errorMessage"
            >
                Incorrect password. Please try again.
            </div>


            <button
                class="close-button"
                id="closeButton"
                type="button"
            >
                Close
            </button>

        </div>

    </div>


    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script>


        /*
         * ----------------------------------
         * PASSWORD
         * ----------------------------------
         *
         * Change this password whenever you like.
         *
         */

        const correctPassword = "CHANGE-ME";


        /*
         * ----------------------------------
         * ELEMENTS
         * ----------------------------------
         */

        const viewWorkButton =
            document.getElementById("viewWorkButton");


        const passwordModal =
            document.getElementById("passwordModal");


        const passwordInput =
            document.getElementById("passwordInput");


        const passwordForm =
            document.getElementById("passwordForm");


        const errorMessage =
            document.getElementById("errorMessage");


        const closeButton =
            document.getElementById("closeButton");


        /*
         * ----------------------------------
         * OPEN PASSWORD WINDOW
         * ----------------------------------
         */

        viewWorkButton.addEventListener("click", function () {

            passwordModal.classList.add("active");

            passwordInput.focus();

        });


        /*
         * ----------------------------------
         * CHECK PASSWORD
         * ----------------------------------
         */

        passwordForm.addEventListener("submit", function (event) {

            event.preventDefault();


            const enteredPassword =
                passwordInput.value;


            if (enteredPassword === correctPassword) {

                /*
                 * Correct password:
                 * go to reels.html
                 */

                window.location.href = "reels.html";

            } else {

                /*
                 * Incorrect password
                 */

                errorMessage.classList.add("show");

                passwordInput.value = "";

                passwordInput.focus();

            }

        });


        /*
         * ----------------------------------
         * CLOSE PASSWORD WINDOW
         * ----------------------------------
         */

        closeButton.addEventListener("click", function () {

            passwordModal.classList.remove("active");

            passwordInput.value = "";

            errorMessage.classList.remove("show");

        });


        /*
         * ----------------------------------
         * ESCAPE KEY
         * ----------------------------------
         */

        document.addEventListener("keydown", function (event) {

            if (event.key === "Escape") {

                passwordModal.classList.remove("active");

                passwordInput.value = "";

                errorMessage.classList.remove("show");

            }

        });


    </script>


</body>

</html>
